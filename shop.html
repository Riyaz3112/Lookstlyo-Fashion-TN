<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - LookStylo Clothing</title>

    <script defer src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ink: #171717;
            --paper: #f5f1eb;
            --card: #ffffff;
            --muted: #666666;
            --line: rgba(23,23,23,.1);
            --gold: #d7a65f;
            --gold-deep: #b7791d;
            --accent: #5e2d91;
        }

        * { box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #f8f4ef 0%, #f3efe8 100%);
            color: var(--ink);
            font-family: Inter, "Segoe UI", sans-serif;
        }
        a { text-decoration: none; }
        img { display: block; max-width: 100%; }

        .brand-shell { display: flex; align-items: center; gap: .8rem; }
        .brand-mark { width: 52px; height: 52px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.08)); }
        .brand-wordmark { display: inline-flex; flex-direction: column; line-height: 1; }
        .brand-wordmark strong { font-family: Georgia, 'Times New Roman', serif; font-size: 1.1rem; letter-spacing: .16em; }
        .brand-wordmark small { margin-top: .2rem; font-size: .52rem; letter-spacing: .48em; text-transform: uppercase; }
        .collection-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(255,255,255,.96);
            border: 1px solid var(--line);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 16px 30px rgba(17,17,17,.045);
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .collection-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 22px 45px rgba(17,17,17,.12);
        }
        .product-photo-frame {
            display: block;
            height: 280px;
            flex: 0 0 280px;
            overflow: hidden;
            background: linear-gradient(180deg, #f4f2f0 0%, #efebe6 100%);
        }
        .product-photo-frame img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #f3f4f6;
        }
        .product-card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.2rem 1.15rem 1.25rem;
        }
        .product-card-content .add-to-cart-btn { margin-top: auto; }
        .product-gallery-thumb {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 10px;
            overflow: hidden;
            transition: border-color .2s ease, transform .2s ease;
            background: white;
        }
        .product-gallery-thumb:hover { transform: translateY(-1px); }
        .product-gallery-thumb.active { border-color: var(--gold-deep); }
        .product-card-content h3 {
            letter-spacing: -.03em;
            line-height: 1.35;
        }
        .size-select, .color-select {
            border-color: rgba(23,23,23,.15);
            border-radius: 10px;
            background: #fff;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .size-select:focus, .color-select:focus {
            outline: none;
            border-color: rgba(183,121,29,.7);
            box-shadow: 0 0 0 3px rgba(183,121,29,.12);
        }
        .add-to-cart-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #7241a8 100%);
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(94,45,145,.18);
        }
        .add-to-cart-btn:hover {
            filter: brightness(1.03);
        }
        @media (max-width: 640px) {
            .product-photo-frame { height: 240px; flex-basis: 240px; }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-900">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 border-b border-black/10 bg-[#f8f4ef]/95 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="brand-shell">
                    <img src="slazzer-preview-x2n1h.png" alt="Lookstylo Logo" class="brand-mark">
                    <span class="brand-wordmark"><strong>LOOKSTYLO</strong><small>Fashion</small></span>
                </div>
                <div class="flex items-center space-x-6 text-sm font-semibold uppercase tracking-[.12em] text-black/70">
                    <a href="index.html" class="transition hover:text-amber-700">Home</a>
                    <a href="cart.html" class="transition hover:text-amber-700">Cart (<span id="cartCount">0</span>)</a>
                    <a href="admin.html" class="rounded-full bg-[#151515] px-4 py-2 text-white transition hover:bg-amber-700">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Opening Soon Banner -->
    <div id="openingBanner" class="bg-gradient-to-r from-[#1d1d1d] via-[#171717] to-[#2d1d0c] text-white px-4 py-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex-1">
                <h3 class="font-bold text-lg mb-1">Premium Sportswear & Everyday Fashion</h3>
                <p class="text-sm text-white/80">Shop No. 2, Opposite Post Office, Pakkirithakka, Tirupathur Main Road, Jolarpattai – 635853</p>
            </div>
            <div class="flex gap-2">
                <a href="https://www.google.com/maps/search/?api=1&query=Shop+No.+2,+Opposite+Post+Office,+Pakkirithakka,+Tirupathur+Main+Road,+Jolarpattai+635853" target="_blank" rel="noopener noreferrer" class="bg-white text-[#151515] font-bold px-4 py-2 rounded-full hover:bg-gray-100 transition text-sm">
                    View on Map
                </a>
                <button onclick="closeBanner()" class="text-white hover:text-gray-200 text-xl font-bold">
                    ✕
                </button>
            </div>
        </div>
    </div>

    <!-- Shop Section -->
    <section id="products" class="py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <div class="mb-10 text-center">
                <p class="mb-3 text-xs font-bold uppercase tracking-[.32em] text-amber-700">LookStylo edit</p>
                <h1 class="display text-5xl sm:text-6xl font-black tracking-tight">Our Collections</h1>
            </div>
            <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Products will be loaded here by JavaScript -->
            </div>
        </div>
    </section>

    <script>
        function closeBanner() {
            document.getElementById('openingBanner').style.display = 'none';
        }
    </script>

    <script>
        async function fetchProducts(){
            try{
                const res = await fetch('/.netlify/functions/get-products');
                const responseText = await res.text();
                let data;
                try { data = JSON.parse(responseText); } catch (error) { throw new Error(`Product service returned HTTP ${res.status} instead of JSON.`); }
                if (!res.ok) throw new Error(data.message || `Product service returned HTTP ${res.status}`);
                if (data.success) return data.products;
            }catch(e){ console.error(e); }
            return [
                { id: 1, name: 'Premium Oversized T-Shirt', price: 599, image: 'IMG101.jpeg', description: 'Viscous fabric', sizes: 'M,L,XL', colors: 3 },
                { id: 2, name: 'NS Shorts', price: 249, image: 'IMG111.jpeg', description: '3-Line Model | Premium Quality', sizes: 'M,L,XL', colors: 10, bulkPrice: 'Buy 5 @ ₹999' },
                { id: 3, name: 'Football Jersey', price: 299, image: 'IMG11.jpeg', description: 'Sports-style football jersey', sizes: 'M,L,XL' },
                { id: 4, name: 'NEW PREMIUM STREET BAGGY', price: 349, image: 'IMG112.jpeg', description: 'Side contrast panel baggy | Premium NS Lycra fabric', sizes: 'M,L,XL,2XL', colors: 8, style: 'Street Baggy', brand: 'ADIDAS' },
                { id: 5, name: 'FLANNEL CHECK FRONT EMBROIDERY', price: 599, image: 'IMAGE112233.jpeg', description: 'Front embroidery | Twill fabric', sizes: 'M,L,XL' },
                { id: 6, name: 'NEW STREETWEAR BAGGY OVERSIZED DROP SHOULDER SHIRT', price: 549, image: 'IMAGE112235.jpeg', images: ['IMAGE112235.jpeg', 'IMAGE112236.jpeg', 'IMAGE112237.jpeg', 'IMAGE112239.jpeg', 'IMAGE112240.jpeg', 'IMAGE112241.jpeg', 'IMAGE112242.jpeg'], description: 'Tie print with front and back print | Heavy GSM cotton fabric', sizes: 'M,L,XL', designs: 8 },
                { id: 7, name: 'PREMIUM QUALITY POLO T-SHIRTS', price: 379, image: 'IMAGE112234.jpeg', description: 'Premium quality | Everyday polo fit', sizes: 'M,L,XL', bulkPrice: 'Buy 3 @ ₹999' }
            ];
        }

        function formatPrice(n){ return '₹' + n; }

        async function loadProducts(){
            const products = await fetchProducts();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach((product, productIndex) => {
                const productCard = document.createElement('div');
                productCard.className = 'collection-card bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition';
                const img = product.images && product.images.length ? product.images[0] : (product.image || '');
                const mainImageId = `product-main-image-${productIndex}`;
                productCard.innerHTML = `
                    <a href="shop.html#products" class="product-photo-frame">
                        <img id="${mainImageId}" src="${img}" alt="${product.name}" onerror="this.src='IMG11.jpeg'">
                    </a>
                    ${product.images && product.images.length > 1 ? `<div class="flex gap-1 overflow-x-auto bg-gray-50 p-2">${product.images.map((image, index) => `<button type="button" class="product-gallery-thumb ${index === 0 ? 'active' : ''}" data-main-image="${mainImageId}" data-image="${image}" aria-label="Show ${product.name} design ${index + 1}"><img src="${image}" alt="${product.name} design ${index + 1}" class="h-12 w-12 shrink-0 object-cover" onerror="this.parentElement.style.display='none'"></button>`).join('')}</div>` : ''}
                    <div class="product-card-content p-4">
                        <h3 class="font-bold text-lg mb-2"><a href="shop.html#products" class="hover:underline">${product.name}</a></h3>
                        <p class="text-gray-600 text-sm mb-4">${product.description || ''}</p>
                        ${product.name === 'Premium Oversized T-Shirt' ? '<p class="text-gray-700 text-sm mb-2"><strong>Sizes:</strong> M, L, XL</p><p class="text-gray-700 text-sm mb-4"><strong>Colours:</strong> 3</p>' : ''}
                        ${product.name === 'NS Shorts' ? '<p class="text-gray-700 text-sm mb-2"><strong>Model:</strong> 3-Line</p><p class="text-gray-700 text-sm mb-2"><strong>Quality:</strong> Premium</p><p class="text-gray-700 text-sm mb-2"><strong>Colours:</strong> 10</p><p class="text-green-700 text-sm font-bold mb-4">Buy 1 @ ₹249 &nbsp; | &nbsp; Buy 5 @ ₹999</p>' : ''}
                        ${product.name === 'NEW PREMIUM STREET BAGGY' ? '<p class="text-gray-700 text-sm mb-2"><strong>Fabric:</strong> Premium NS Lycra Fabric</p><p class="text-gray-700 text-sm mb-2"><strong>Colours:</strong> 8</p><p class="text-gray-700 text-sm mb-2"><strong>Style:</strong> Street Baggy</p><p class="text-gray-700 text-sm mb-2"><strong>Brand:</strong> ADIDAS</p><p class="text-gray-700 text-sm mb-4"><strong>Sizes:</strong> M, L, XL, 2XL</p>' : ''}
                        ${product.name === 'FLANNEL CHECK FRONT EMBROIDERY' ? '<p class="text-gray-700 text-sm mb-2"><strong>Fabric:</strong> Twill</p><p class="text-gray-700 text-sm mb-2"><strong>Detail:</strong> Front Embroidery</p><p class="text-gray-700 text-sm mb-4"><strong>Sizes:</strong> M, L, XL</p>' : ''}
                        ${product.name === 'NEW STREETWEAR BAGGY OVERSIZED DROP SHOULDER SHIRT' ? '<p class="text-gray-700 text-sm mb-2"><strong>Model:</strong> New Streetwear Baggy Oversized Drop Shoulder</p><p class="text-gray-700 text-sm mb-2"><strong>Fabric:</strong> Heavy GSM Cotton</p><p class="text-gray-700 text-sm mb-2"><strong>Print:</strong> Tie print, front and back print</p><p class="text-gray-700 text-sm mb-2"><strong>Designs:</strong> 8</p><p class="text-gray-700 text-sm mb-4"><strong>Sizes:</strong> M, L, XL</p>' : ''}
                        ${product.name === 'PREMIUM QUALITY POLO T-SHIRTS' ? '<p class="text-gray-700 text-sm mb-2"><strong>Quality:</strong> Premium</p><p class="text-gray-700 text-sm mb-2"><strong>Style:</strong> Everyday Polo Fit</p><p class="text-gray-700 text-sm mb-2"><strong>Sizes:</strong> M, L, XL</p><p class="text-green-700 text-sm font-bold mb-4">Buy 1 @ ₹379 &nbsp; | &nbsp; Buy 3 @ ₹999</p>' : ''}
                        <p class="text-purple-700 font-bold text-xl mb-4">${formatPrice(product.price)}</p>
                        <div class="space-y-3 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Size</label>
                                <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 size-select text-sm" placeholder="Type size (e.g. M, XL)" aria-label="Enter size for ${product.name}">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Color</label>
                                <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 color-select text-sm" placeholder="Type color (e.g. Black)" aria-label="Enter color for ${product.name}">
                            </div>
                        </div>
                        <button class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-2 rounded transition add-to-cart-btn" data-product-id="${product.id}" data-product-name="${product.name}" data-product-price="${product.price}">
                            Add to Cart
                        </button>
                    </div>
                `;
                grid.appendChild(productCard);
            });

            document.querySelectorAll('.add-to-cart-btn').forEach(btn => btn.addEventListener('click', addToCart));
            document.querySelectorAll('.product-gallery-thumb').forEach(thumb => thumb.addEventListener('click', () => {
                const mainImage = document.getElementById(thumb.dataset.mainImage);
                if (mainImage) mainImage.src = thumb.dataset.image;
                thumb.parentElement.querySelectorAll('.product-gallery-thumb').forEach(item => item.classList.remove('active'));
                thumb.classList.add('active');
            }));
        }

        function addToCart(e){
            const btn = e.target;
            const productId = parseInt(btn.dataset.productId);
            const productName = btn.dataset.productName;
            const productPrice = parseFloat(btn.dataset.productPrice);
            const card = btn.closest('.bg-white');
            const size = card.querySelector('.size-select').value;
            const color = card.querySelector('.color-select').value;
            if (!size.trim() || !color.trim()) {
                alert('Please type a size and color before adding this product.');
                return;
            }
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => item.id === productId && item.size === size && item.color === color);
            if (existing) existing.quantity += 1; else cart.push({ id: productId, name: productName, price: productPrice, size, color, quantity: 1 });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            btn.textContent = '✓ Added to Cart'; btn.disabled = true;
            setTimeout(()=>{ btn.textContent = 'Add to Cart'; btn.disabled = false; }, 1400);
        }

        function updateCartCount(){ const cart = JSON.parse(localStorage.getItem('cart') || '[]'); const c = cart.reduce((s,i)=> s + i.quantity,0); document.getElementById('cartCount').textContent = c; }

        loadProducts(); updateCartCount(); setInterval(updateCartCount, 1000);
    </script>
</body>
</html>
