<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - LookStylo Clothing</title>
    <script defer src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ink: #171717;
            --paper: #f5f1eb;
            --card: #ffffff;
            --line: rgba(23,23,23,.10);
            --muted: #666666;
            --accent: #5e2d91;
            --gold: #d9a856;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #f8f4ef 0%, #f3efe8 100%);
            color: var(--ink);
            font-family: Inter, "Segoe UI", sans-serif;
        }
        img { max-width: 100%; display: block; }
        a { color: #4f46e5; text-decoration: none; }
        a:hover { text-decoration: none; }
        button { font: inherit; cursor: pointer; }
        nav {
            background: rgba(248,244,239,.95);
            box-shadow: 0 10px 15px rgba(15, 23, 42, 0.06);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(12px);
        }
        .container { width: min(1120px, 100%); margin: 0 auto; padding: 0 1rem; }
        .nav-inner { display: flex; align-items: center; justify-content: space-between; min-height: 5rem; }
        .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .nav-links a { color: #374151; font-weight: 600; }
        .banner { background: linear-gradient(90deg, #1d1d1d, #2d1d0c); color: #ffffff; padding: 1rem; }
        .banner-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: center; width: min(1120px, 100%); margin: 0 auto; padding: 0 1rem; }
        .banner button { border: none; background: transparent; color: #ffffff; font-size: 1.35rem; line-height: 1; }
        .page-section { padding: 3rem 1rem; }
        .content-wrapper { width: min(960px, 100%); margin: 0 auto; }
        .brand-shell { display: flex; align-items: center; gap: .8rem; }
        .brand-mark { width: 54px; height: 54px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.08)); }
        .brand-wordmark { display: inline-flex; flex-direction: column; line-height: 1; }
        .brand-wordmark strong { font-family: Georgia, 'Times New Roman', serif; font-size: 1.1rem; letter-spacing: .16em; }
        .brand-wordmark small { margin-top: .2rem; font-size: .52rem; letter-spacing: .48em; text-transform: uppercase; }
        .card {
            background: rgba(255,255,255,.96);
            border: 1px solid var(--line);
            border-radius: 1.25rem;
            box-shadow: 0 16px 30px rgba(15, 23, 42, 0.06);
            padding: 1.5rem;
        }
        .card + .card { margin-top: 1.5rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.4; }
        .text-3xl { font-size: 1.875rem; line-height: 1.2; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-gray-700 { color: #374151; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-500 { color: #6b7280; }
        .text-purple-700 { color: var(--accent); }
        .bg-white { background: #ffffff; }
        .bg-gray-50 { background: #f8fafc; }
        .bg-gray-300 { background: #d1d5db; }
        .bg-purple-700 { background: linear-gradient(135deg, var(--accent) 0%, #7241a8 100%); }
        .bg-purple-800 { background: #5b21b6; }
        .bg-red-500 { background: #ef4444; }
        .rounded { border-radius: 0.75rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 1rem; }
        .shadow-md { box-shadow: 0 10px 15px rgba(15, 23, 42, 0.08); }
        .shadow-lg { box-shadow: 0 25px 50px rgba(15, 23, 42, 0.1); }
        .sticky { position: sticky; }
        .top-0 { top: 0; }
        .z-50 { z-index: 50; }
        .max-w-7xl { max-width: 80rem; }
        .max-w-4xl { max-width: 64rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .sm\:px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .lg\:px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .pb-4 { padding-bottom: 1rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .border { border: 1px solid var(--line); }
        .border-b { border-bottom: 1px solid var(--line); }
        .border-gray-300 { border-color: #d1d5db; }
        .gap-2 { gap: 0.5rem; }
        .space-x-4 > :not([hidden]) + :not([hidden]) { margin-left: 1rem; }
        .flex { display: flex; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .w-full { width: 100%; }
        .w-16 { width: 4rem; }
        .h-20 { height: 5rem; }
        .h-16 { height: 4rem; }
        .w-auto { width: auto; }
        .object-contain { object-fit: contain; }
        .text-black { color: #111827; }
        .font-bold { font-weight: 700; }
        .font-medium { font-weight: 500; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-4 { margin-top: 1rem; }
        .min-h-screen { min-height: 100vh; }
        .text-center { text-align: center; }
        .transition { transition: all 0.2s ease-in-out; }
        input[type="number"] { width: 4rem; border: 1px solid #d1d5db; border-radius: 0.5rem; padding: 0.5rem; }
        .button-primary { background: linear-gradient(135deg, var(--accent) 0%, #7241a8 100%); color: #ffffff; border: none; border-radius: 0.875rem; padding: 0.875rem 1rem; font-weight: 700; box-shadow: 0 12px 24px rgba(94,45,145,.18); }
        .button-secondary { background: #d1d5db; color: #111827; border: none; border-radius: 0.875rem; padding: 0.875rem 1rem; font-weight: 700; }
        .button-primary:hover { filter: brightness(1.03); }
        .button-secondary:hover { background: #9ca3af; }
        .text-sm { font-size: 0.875rem; }
        @media (max-width: 768px) {
            .nav-inner, .banner-inner { flex-direction: column; align-items: stretch; }
            .nav-links { justify-content: center; }
            .page-section { padding: 2rem 1rem; }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-900">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 border-b border-black/10 bg-[#f8f4ef]/95 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="brand-shell">
                    <img src="slazzer-preview-x2n1h.png" alt="Lookstylo Logo" class="brand-mark">
                    <span class="brand-wordmark"><strong>LOOKSTYLO</strong><small>Fashion</small></span>
                </div>
                <div class="flex items-center space-x-4 text-sm font-semibold uppercase tracking-[.12em] text-black/70">
                    <a href="index.html" class="transition hover:text-amber-700">Home</a>
                    <a href="shop.html" class="transition hover:text-amber-700">Shop</a>
                    <a href="admin.html" class="rounded-full bg-[#151515] px-4 py-2 text-white transition hover:bg-amber-700">Admin</a>
                    <a href="billing.html" class="rounded-full bg-[#5e2d91] px-4 py-2 text-white transition hover:brightness-110">Billing App</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Opening Soon Banner -->
    <div id="openingBanner" class="bg-gradient-to-r from-[#1d1d1d] via-[#171717] to-[#2d1d0c] text-white px-4 py-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex-1">
                <h3 class="font-bold text-lg mb-1">Premium Sportswear & Everyday Fashion</h3>
                <p class="text-sm text-white/80">Shop No. 2, Opposite Post Office, Pakkirithakka, Tirupathur Main Road, Jolarpattai – 635853</p>
            </div>
            <div class="flex gap-2">
                <a href="https://www.google.com/maps/search/?api=1&query=Shop+No.+2,+Opposite+Post+Office,+Pakkirithakka,+Tirupathur+Main+Road,+Jolarpattai+635853" target="_blank" rel="noopener noreferrer" class="bg-white text-[#151515] font-bold px-4 py-2 rounded-full hover:bg-gray-100 transition text-sm">
                    View on Map
                </a>
                <button onclick="closeBanner()" class="text-white hover:text-gray-200 text-xl font-bold">
                    ✕
                </button>
            </div>
        </div>
    </div>

    <!-- Cart Section -->
    <section class="py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-4xl mx-auto">
            <div class="mb-10">
                <p class="mb-3 text-xs font-bold uppercase tracking-[.32em] text-amber-700">Your selection</p>
                <h1 class="text-5xl font-black tracking-tight">Shopping Cart</h1>
            </div>
            
            <div id="cartItems" class="card mb-8">
                <!-- Cart items will be loaded here -->
            </div>

            <div class="card">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <span class="text-xl font-bold">Total:</span>
                    <span class="text-3xl font-bold text-purple-700">₹<span id="cartTotal">0</span></span>
                </div>
                
                <div class="space-y-3">
                    <button onclick="continueShopping()" class="button-secondary w-full">
                        Continue Shopping
                    </button>
                    <button onclick="proceedToCheckout()" class="button-primary w-full">
                        Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script>
        function closeBanner() {
            document.getElementById('openingBanner').style.display = 'none';
        }

        // Load and display cart items
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const cartItemsDiv = document.getElementById('cartItems');
            const cartTotalSpan = document.getElementById('cartTotal');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p class="text-center text-gray-500 py-8">Your cart is empty</p>';
                cartTotalSpan.textContent = '0';
                return;
            }

            let total = 0;
            let html = '<div class="space-y-4">';

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                html += `
                    <div class="flex items-center justify-between border-b pb-4">
                        <div class="flex-1">
                            <h3 class="font-bold text-lg">${item.name}</h3>
                            <p class="text-gray-600 text-sm">Size: ${item.size} | Color: ${item.color}</p>
                            <p class="text-purple-700 font-bold">₹${item.price} x ${item.quantity} = ₹${itemTotal}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" min="1" value="${item.quantity}" onchange="updateQuantity(${index}, this.value)" 
                                   class="w-16 border border-gray-300 rounded px-2 py-1">
                            <button onclick="removeFromCart(${index})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded">
                                Remove
                            </button>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            cartItemsDiv.innerHTML = html;
            cartTotalSpan.textContent = total.toFixed(2);
        }

        window.updateQuantity = function(index, newQuantity) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const qty = parseInt(newQuantity);

            if (qty > 0) {
                cart[index].quantity = qty;
            } else {
                cart.splice(index, 1);
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        };

        window.removeFromCart = function(index) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        };

        window.continueShopping = function() {
            window.location.href = 'shop.html';
        };

        window.proceedToCheckout = function() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            window.location.href = 'checkout.html';
        };

        // Load cart on page load
        loadCart();
    </script>
</body>
</html>
